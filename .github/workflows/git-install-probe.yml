name: git-install-probe
# Temporary. Finds why npx fails to install spec-ctx from git on a GitHub runner.
on: [push]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          d=$(mktemp -d); cd "$d"
          code=0; GIT_TRACE=1 npm_config_cache="$d/c" npx -y "github:sonqh/spec-ctx#main" --version > out.txt 2>&1 || code=$?
          echo "::warning::A exit $code $(grep -E 'trace|fatal|error' out.txt | tail -12 | cut -c1-250 | tr '\n' '|')"
          code=0; out=$(git ls-remote https://github.com/sonqh/spec-ctx.git main 2>&1) || code=$?
          echo "::warning::B ls-remote exit $code $out"
          code=0; out=$(npm_config_cache="$d/c2" npm pack "github:sonqh/spec-ctx#main" 2>&1 | tail -5) || code=$?
          echo "::warning::C pack exit $code $(echo "$out" | tr '\n' '|')"
          code=0; out=$(npm_config_cache="$d/c3" npx -y npm@11 exec -y "github:sonqh/spec-ctx#main" -- --version 2>&1 | tail -3) || code=$?
          echo "::warning::D npm11 exit $code $(echo "$out" | tr '\n' '|')"
