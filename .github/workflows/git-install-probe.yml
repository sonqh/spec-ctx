name: git-install-probe
# Temporary. Finds why npx fails to install spec-ctx from git on a GitHub runner.
on: [push]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          d=$(mktemp -d); cd "$d"
          code=0; npm_config_cache="$d/c" npx -y --loglevel silly "github:sonqh/spec-ctx#main" --version > out.txt 2>&1 || code=$?
          echo "::warning::probe exit $code"
          echo "::warning::TAIL $(tail -45 out.txt | cut -c1-220 | tr '\n' '|')"
