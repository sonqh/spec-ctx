name: ci
on: [push, pull_request]
jobs:
  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      # REQ-GOV-003 spec gates
      - run: npx -y @fission-ai/openspec@latest validate --all --strict
      - run: node dist/cli.js build && node dist/cli.js check --strict
      - name: markdown linters
        run: |
          set -e
          for f in *.md decisions/*.md $(find openspec docs skills schemas -name '*.md' 2>/dev/null); do
            python3 scripts/tells-lint.py --baseline 0 "$f"
            python3 scripts/ste-lint.py --baseline 0 --disable synonym-rotation "$f"
          done
  code:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [bun, node]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      # REQ-DIST-001 the suite runs on Bun and on Node 22
      - run: if [ "${{ matrix.runtime }}" = bun ]; then bun run test; else bun run test:node; fi
      - run: node dist/cli.js --help | python3 scripts/ste-lint.py --baseline 0
      - run: bash tests/parity/run.sh
      # REQ-SCH-001 REQ-SCH-002 the schema bundle against the pinned OpenSpec version
      - run: bash tests/schema/validate.sh && bash tests/schema/roundtrip.sh
        if: matrix.runtime == 'bun'
      - run: bash tests/action/selftest.sh
        if: matrix.runtime == 'bun'
      # REQ-DIST-008 install from git with Node only
      # npx 10 fails on a 40 character SHA in a git spec, so the test takes a short one
      - run: |
          if ! bash tests/install/git.sh "${GITHUB_SHA::12}" > /tmp/git-install.log 2>&1; then
            echo "::error::git install log: $(tail -c 1500 /tmp/git-install.log | tr '\n' ' ')"
            echo "::error::tools: node $(node --version) npm $(npm --version) git $(command -v git) bun $(command -v bun)"
            exit 1
          fi
          cat /tmp/git-install.log
        if: matrix.runtime == 'node'
      - run: bun run build:bin && ./build/specctx --version
        if: matrix.runtime == 'bun'
