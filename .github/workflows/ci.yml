name: ci
on: [push, pull_request]
jobs:
  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      # REQ-GOV-003 spec gates
      - run: npx -y @fission-ai/openspec@latest validate --all --strict
      - run: node dist/cli.js build && node dist/cli.js check --strict
      - name: markdown linters
        run: |
          set -e
          for f in *.md decisions/*.md $(find openspec docs skills -name '*.md' 2>/dev/null); do
            python3 scripts/tells-lint.py --baseline 0 "$f"
            python3 scripts/ste-lint.py --baseline 0 --disable synonym-rotation "$f"
          done
  code:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [bun, node]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      # REQ-DIST-001 the suite runs on Bun and on Node 22
      - run: if [ "${{ matrix.runtime }}" = bun ]; then bun run test; else bun run test:node; fi
      - run: node dist/cli.js --help | python3 scripts/ste-lint.py --baseline 0
      - run: bash tests/parity/run.sh
      - run: bun run build:bin && ./build/specctx --version
        if: matrix.runtime == 'bun'
