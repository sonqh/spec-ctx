name: ci
# REQ-GOV-005 one run per push to main or pull request. A newer push cancels the older run.
# Every run line of the specs and code jobs is also a line of scripts/ci-local.sh (REQ-GOV-004).
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci-changes.sh "$BASE" >> "$GITHUB_OUTPUT"
  specs:
    runs-on: ubuntu-latest
    steps:
      # REQ-ADOPT-008 the gate compares .ctx/baseline.json with the merge base, so origin/main must exist on a pull request
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: node dist/cli.js gate --strict --markdown "*.md decisions/*.md openspec/**/*.md docs/**/*.md skills/**/*.md schemas/**/*.md"
  code:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [bun, node]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test
        if: matrix.runtime == 'bun'
      - run: bun run test:node
        if: matrix.runtime == 'node'
      - run: node dist/cli.js --help | node dist/cli.js lint ste --baseline 0
      - run: bash tests/parity/run.sh
      - run: bash tests/schema/validate.sh && bash tests/schema/roundtrip.sh
        if: matrix.runtime == 'bun'
      - run: bash tests/action/selftest.sh
        if: matrix.runtime == 'bun'
      # REQ-ADOPT-006 REQ-ADOPT-008 REQ-SCH-005 the fresh, the existing, and the rules-only path end to end, on upstream OpenSpec
      - run: bash tests/paths/fresh.sh && bash tests/paths/fresh-brackets.sh && bash tests/paths/existing.sh && bash tests/paths/rules-only.sh
        if: matrix.runtime == 'bun'
      - run: bash tests/install/ci.sh
        if: matrix.runtime == 'node'
        env:
          GH_TOKEN: ${{ github.token }}
      - run: bash tests/gov/version-guard.sh && bash tests/release/skip.sh && bash tests/release/published.sh && bash tests/dogfood/agentrc.sh
        if: matrix.runtime == 'bun'
      - run: bun run build:bin && ./build/specctx --version
        if: matrix.runtime == 'bun'
