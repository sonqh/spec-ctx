name: ci
on: [push, pull_request]
jobs:
  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npx -y @fission-ai/openspec@latest validate --all --strict
      - run: python3 tools/ctx/ctx.py build && python3 tools/ctx/ctx.py check --strict
      - run: |
          set -e
          for f in CLAUDE.md README.md DELEGATION.md decisions/*.md $(find openspec docs skills -name '*.md' 2>/dev/null); do
            python3 scripts/tells-lint.py --baseline 0 "$f"
            python3 scripts/ste-lint.py --baseline 0 --disable synonym-rotation "$f"
          done
  code:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [bun, node]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: pkg
        run: test -f package.json && echo present=1 >> "$GITHUB_OUTPUT" || echo present=0 >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        if: steps.pkg.outputs.present == '1'
      - run: bun install
        if: steps.pkg.outputs.present == '1'
      - run: bun run typecheck
        if: steps.pkg.outputs.present == '1'
      - run: bun run build
        if: steps.pkg.outputs.present == '1'
      - run: if [ "${{ matrix.runtime }}" = bun ]; then bun run test; else bun run test:node; fi
        if: steps.pkg.outputs.present == '1'
      - run: node dist/cli.js --help | python3 scripts/ste-lint.py --baseline 0
        if: steps.pkg.outputs.present == '1'
