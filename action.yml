name: spec-ctx check
description: Run specctx check, the markdown linters, and openspec validate on an OpenSpec project.
branding:
  icon: check-square
  color: blue
inputs:
  version:
    description: Version of the spec-ctx npm package, or a git spec such as github:sonqh/spec-ctx#main.
    default: latest
  strict:
    description: Run check and validate in strict mode.
    default: "true"
  markdown:
    description: Globs of the markdown files that the linters read, separated by spaces.
    default: "openspec/**/*.md decisions/*.md *.md"
  specctx:
    description: Command that runs specctx. Empty means npx with the version input.
    default: ""
  rerun:
    description: Run only gate --rerun. It reruns the Verify command of each task that the pull request closed. Use it on pull_request or push only. On push, pass base: ${{ github.event.before }}.
    default: "false"
  base:
    description: With rerun, the ref for the merge base, such as origin/main. On push, use ${{ github.event.before }}. Empty uses the default of spec-ctx.toml. Without rerun, the action ignores it.
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: spec-ctx gates
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/action/run.sh"
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_MARKDOWN: ${{ inputs.markdown }}
        INPUT_SPECCTX: ${{ inputs.specctx }}
        INPUT_RERUN: ${{ inputs.rerun }}
        INPUT_BASE: ${{ inputs.base }}
        SPECCTX_ACTION_PATH: ${{ github.action_path }}
